# REPLACES your existing file at:  .github/workflows/scan.yml
#
# Full-day coverage, split into two jobs because GitHub kills any single
# job at 6 hours and the US session runs 6.5 hours.
#   AM session  9:35 -> 12:40 ET   (~3h05m)
#   PM session 12:50 -> 16:05 ET   (~3h15m)
# The 10-minute gap lets AM commit state.json before PM checks it out.
#
# Two crons per session handle US daylight saving; the script's Eastern-time
# window check makes sure only the correct one proceeds each day.

name: Daily Options Scanner

on:
  schedule:
    - cron: '32 13 * * 1-5'   # AM  9:32 ET summer (EDT)
    - cron: '32 14 * * 1-5'   # AM  9:32 ET winter (EST)
    - cron: '48 16 * * 1-5'   # PM 12:48 ET summer (EDT)
    - cron: '48 17 * * 1-5'   # PM 12:48 ET winter (EST)
  workflow_dispatch:
    inputs:
      session:
        description: 'Which session to run'
        type: choice
        options: [am, pm]
        default: am

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240        # under GitHub's hard 6-hour job ceiling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # Scheduled runs before 15:00 UTC are the AM session; later = PM.
          SESSION: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.session
                || (startsWith(github.event.schedule, '32 ') && 'am' || 'pm') }}
        run: python scanner.py

      - name: Commit journal and state
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add journal.csv state.json 2>/dev/null || true
          git commit -m "scanner $(date -u +%F-%H%M)" || echo "nothing to commit"
          git push || echo "nothing to push"
