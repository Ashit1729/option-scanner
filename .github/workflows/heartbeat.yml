# SAVE AT:  .github/workflows/heartbeat.yml
#
# TEMPORARY DIAGNOSTIC. Delete once the schedule question is settled.
#
# This does nothing but prove whether GitHub's scheduler fires in your repo.
# It runs every 15 minutes and posts one line to Discord. If you see these
# appear on their own, cron works and the problem is specific to scan.yml.
# If you see nothing for 2 hours, cron is not firing for the repo at all.

name: Schedule Heartbeat (temporary)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say hello
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRIGGER: ${{ github.event_name }}
        run: |
          MSG="💓 heartbeat · $(date -u '+%H:%M UTC') · trigger=${TRIGGER}"
          echo "$MSG"
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"$MSG\"}" "$HOOK" > /dev/null
